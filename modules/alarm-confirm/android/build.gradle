plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarmconfirm'
version = '0.1.0'

android {
  namespace "expo.modules.alarmconfirm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.datastore:datastore-preferences:1.1.1"
}